name: Workflow de seguridad (entregable de clase)

on:
  workflow_dispatch:
    inputs: #petición al usuario de declarar si quiere runnear o no el test "security" de tipo booleano donde el valor default es false.
      testseguridad:
        description: 'Would you like to run the security tests?'
        required: true
        type: boolean
        default: false

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Descargar/Clonar el repo en el runner
        uses: actions/checkout@v4 #action oficial de Github para descargar el repo en la máquina

      - name: Step 2 - Validar el archivo JSON (syntax)
        run: python3 -m json.tool .github/workflows/ventas.json #comando nativo de python que lee y válida el archivo .json (ventas.json)

      - name: Step 3 - Comprobando seguridad de las APIs expuestas
        if: ${{ inputs.testseguridad == true }} #en el caso de que el input sea true, ejecuta esto...
        run: python script.py

    